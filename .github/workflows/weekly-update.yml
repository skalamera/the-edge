name: Weekly update

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC (7am New York in summer, 6am in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Research and write this week's update
        run: npm run update
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Make sure the site still builds
        run: npm run build
      - name: Commit the new update
        run: |
          git config user.name "The Edge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "This Week: $(TZ=America/New_York date +%F)"
          git push

  deploy:
    needs: update
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
